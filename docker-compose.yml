services:
    web:
        build:
            context: .
            target: production
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Template User Role Perm}
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        container_name: vue_template_user_role_perm_web
        restart: unless-stopped
        ports:
            - "${HOST_PORT:-5173}:80"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:80"]
            interval: 1m
            timeout: 10s
            retries: 3
            start_period: 30s
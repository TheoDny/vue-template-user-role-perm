services:
    web:
        build:
            context: .
            target: production
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Template User Role Perm}
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        container_name: vue_template_user_role_perm_web
        restart: unless-stopped
        ports:
            - "${WEB_PORT_HOST:-5173}:80"
